name: Feature request
description: Suggest an improvement to Fingertip Incantations.
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the gameplay or workflow that could be improved.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or related mods
