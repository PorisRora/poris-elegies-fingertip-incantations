modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT (code); All Rights Reserved (artwork)"
issueTrackerURL="https://github.com/PorisRora/poris-elegies-fingertip-incantations/issues"

[[mixins]]
config="poris_elegies_fingertip_incantations.mixins.json"

[[mods]]
modId="poris_elegies_fingertip_incantations"
version="${mod_version}"
displayName="珀璃丝追忆录：指尖咒文 | Poris Elegies: Fingertip Incantations"
authors="Rooboko"
displayURL="https://github.com/PorisRora/poris-elegies-fingertip-incantations"
logoFile="assets/poris_elegies_fingertip_incantations/textures/gui/mod_logo.png"
description='''
RPG HUD shortcuts and inventory-backed hands. Items stay in their original inventory slots.
Install on both client and server. Works on its own; other mods can add skills through its API.
'''

# Lowest version tested: 21.1.181 (21.1.180 puts the client setup listener on the game bus and refuses to load).
[[dependencies.poris_elegies_fingertip_incantations]]
modId="neoforge"
type="required"
versionRange="[21.1.181,)"
ordering="NONE"
side="BOTH"

[[dependencies.poris_elegies_fingertip_incantations]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# The built-in skill adapter is tested with this version; older ones are refused rather than half working.
[[dependencies.poris_elegies_fingertip_incantations]]
modId="irons_spellbooks"
type="optional"
versionRange="[1.21.1-3.15.5,)"
ordering="NONE"
side="BOTH"
